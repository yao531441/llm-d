apiVersion: resource.k8s.io/v1
kind: ResourceClaimTemplate
metadata:
  name: xpu-data-nic
spec:
  spec:
    devices:
      requests:
        - name: nic
          exactly:
            deviceClassName: dranet-rdma
            count: 1
            selectors:
              - cel:
                  expression: device.attributes["dra.net"].rdma == true
