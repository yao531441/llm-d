apiVersion: leaderworkerset.x-k8s.io/v1
kind: LeaderWorkerSet
metadata:
  name: wide-ep-lws-xpu-vllm-decode
  labels:
    llm-d.ai/model: DeepSeek-V2-Lite-Chat
    llm-d.ai/role: decode
spec:
  replicas: 1
  # Avoid surge-based rollouts that need a spare copy of the group's XPUs:
  # a cluster sized for exactly one decode group would otherwise deadlock on
  # updates. Mirrors the NVIDIA GPU DisaggregatedSet base.
  rolloutStrategy:
    type: RollingUpdate
    rollingUpdateConfiguration:
      maxSurge: 0
      maxUnavailable: 1
  leaderWorkerTemplate:
    # This is the cross-node wide-EP axis: each pod in the group (1 leader +
    # size-1 workers) runs one DP rank (DP_SIZE_LOCAL=1 below) with its own
    # TP_SIZE-way expert-parallel shard, and vLLM's DP supervisor fans
    # requests out across the whole group. size: 2 is the smallest
    # configuration that actually exercises cross-pod (and, with the
    # podAntiAffinity below, cross-node) EP; raise it to match your target
    # EP world size / node count.
    size: 2
    # vLLM's DP-supervisor model (since DP_SIZE_LOCAL=1, we can't use
    # --data-parallel-multi-port-external-lb, which needs local size >= 2)
    # requires exactly one full API-server rank (global rank 0, the LWS
    # leader) and all other ranks running --headless (engine-only, no HTTP
    # server, no client-facing sidecar). LWS's separate leaderTemplate /
    # workerTemplate fields express that split directly; a single
    # workerTemplate (no leaderTemplate) with size: 1, as this guide shipped
    # previously, only ever runs one pod with TP+EP mixed locally and is not
    # wide EP at all.
    leaderTemplate:
      metadata:
        labels:
          llm-d.ai/inference-serving: "true"
          llm-d.ai/guide: wide-ep-lws
          llm-d.ai/accelerator-variant: xpu
          llm-d.ai/accelerator-vendor: intel
          llm-d.ai/model: DeepSeek-V2-Lite-Chat
          llm-d.ai/role: decode
      spec:
        serviceAccountName: sa
        securityContext:
          fsGroup: 107
          supplementalGroups:
            - 107
        affinity:
          # Force the leader and every worker in the group onto distinct
          # physical hosts, so the group is actually spread cross-node
          # instead of coincidentally landing on one node.
          podAntiAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              - topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    llm-d.ai/role: decode
        resourceClaims:
          - name: xpu-decode-claim
            resourceClaimTemplateName: xpu-decode-claim
        initContainers:
          - name: routing-proxy
            args:
              - --port=8000
              - --kv-connector=nixlv2
              - --zap-log-level=1
              - --secure-proxy=false
              - --enable-prefiller-sampling
            image: REPLACE_ROUTING_SIDECAR_IMAGE
            imagePullPolicy: Always
            ports:
              - containerPort: 8000
                name: sidecar
                protocol: TCP
            resources: {}
            restartPolicy: Always
            securityContext:
              allowPrivilegeEscalation: false
              runAsNonRoot: true
        volumes:
          - name: dshm
            emptyDir:
              medium: Memory
              sizeLimit: 16Gi
          - name: hf-cache
            emptyDir: {}
          - name: vllm-cache
            emptyDir: {}
        containers:
          - name: vllm
            image: REPLACE_MODEL_SERVER_IMAGE
            imagePullPolicy: Always
            securityContext:
              capabilities:
                add:
                  - IPC_LOCK
              runAsGroup: 0
              runAsUser: 0
            command:
              - /bin/bash
              - -c
            args:
              - |-
                find /dev/shm -type f -delete

                #################
                # RUN vLLM decode via DP Supervisor. LWS injects
                # LWS_WORKER_INDEX/LWS_GROUP_SIZE/LWS_LEADER_ADDRESS; the
                # leader is always LWS_WORKER_INDEX=0, i.e. START_RANK=0.
                #################
                START_RANK=$(( ${LWS_WORKER_INDEX:-0} * DP_SIZE_LOCAL ))

                exec vllm serve \
                  deepseek-ai/DeepSeek-V2-Lite-Chat \
                  --host 0.0.0.0 \
                  --port 8200 \
                  --trust-remote-code \
                  --dtype float16 \
                  --block-size 64 \
                  --enforce-eager \
                  --gpu-memory-utilization ${GPU_MEMORY_UTILIZATION} \
                  --max-model-len ${MAX_MODEL_LEN} \
                  --tensor-parallel-size ${TP_SIZE} \
                  --enable-expert-parallel \
                  --data-parallel-supervisor-port 8008 \
                  --data-parallel-size $((LWS_GROUP_SIZE * DP_SIZE_LOCAL)) \
                  --data-parallel-size-local ${DP_SIZE_LOCAL} \
                  --data-parallel-address ${LWS_LEADER_ADDRESS} \
                  --data-parallel-rpc-port 5555 \
                  --data-parallel-start-rank ${START_RANK} \
                  --all2all-backend allgather_reducescatter \
                  --kv-transfer-config '{"kv_connector":"NixlConnector",
                                          "kv_role":"kv_both",
                                          "kv_buffer_device":"xpu"}' \
                  --disable-access-log-for-endpoints=/health,/metrics,/v1/models
            env:
              - name: HF_TOKEN
                valueFrom:
                  secretKeyRef:
                    name: llm-d-hf-token
                    key: HF_TOKEN
              - name: VLLM_NIXL_SIDE_CHANNEL_HOST
                valueFrom:
                  fieldRef:
                    fieldPath: status.podIP
              - name: VLLM_NIXL_SIDE_CHANNEL_PORT
                value: "5600"
              - name: VLLM_USE_V1
                value: "1"
              - name: VLLM_WORKER_MULTIPROC_METHOD
                value: spawn
              - name: VLLM_ENABLE_V1_MULTIPROCESSING
                value: "1"
              - name: VLLM_MULTIPROC_EXECUTE_MODEL_TIMEOUT_S
                value: "1200"
              - name: TORCH_LLM_ALLREDUCE
                value: "1"
              - name: UCX_TLS
                value: tcp,ze_copy
              - name: UCX_MEMTYPE_CACHE
                value: "0"
              - name: USER
                value: llm-d
              - name: TP_SIZE
                value: "2"
              - name: DP_SIZE_LOCAL
                value: "1" # 1 DP rank per pod; leaderWorkerTemplate.size is the cross-node DP/EP axis
              - name: MAX_MODEL_LEN
                value: "512"
              - name: GPU_MEMORY_UTILIZATION
                value: "0.8"
              - name: VLLM_LOGGING_LEVEL
                value: INFO
              - name: HF_HUB_CACHE
                value: /var/cache/huggingface
              - name: VLLM_CACHE_ROOT
                value: /var/cache/vllm
            ports:
              - containerPort: 8200
                name: modelserver
                protocol: TCP
              - containerPort: 8008
                name: supervisor
                protocol: TCP
              - containerPort: 5600
                name: nixl
                protocol: TCP
            startupProbe:
              httpGet:
                path: /health
                port: modelserver
              initialDelaySeconds: 30
              periodSeconds: 30
              timeoutSeconds: 10
              failureThreshold: 120
            livenessProbe:
              httpGet:
                path: /health
                port: modelserver
              periodSeconds: 30
              timeoutSeconds: 10
              failureThreshold: 20
            readinessProbe:
              httpGet:
                path: /v1/models
                port: modelserver
              periodSeconds: 10
              timeoutSeconds: 5
              failureThreshold: 6
            resources:
              limits:
                cpu: "16"
                memory: 128Gi
              requests:
                cpu: "16"
                memory: 128Gi
              claims:
                - name: xpu-decode-claim
            volumeMounts:
              - name: dshm
                mountPath: /dev/shm
              - name: hf-cache
                mountPath: /var/cache/huggingface
              - name: vllm-cache
                mountPath: /var/cache/vllm
    workerTemplate:
      # Non-zero ranks: --headless engine-only process. No client-facing
      # sidecar, no HTTP API server on this pod - it only runs the local
      # vLLM engine core and connects back to the leader's DP coordinator
      # (LWS_LEADER_ADDRESS:5555). Probes use process liveness instead of
      # HTTP since there's no HTTP surface in headless mode.
      metadata:
        labels:
          llm-d.ai/inference-serving: "true"
          llm-d.ai/guide: wide-ep-lws
          llm-d.ai/accelerator-variant: xpu
          llm-d.ai/accelerator-vendor: intel
          llm-d.ai/model: DeepSeek-V2-Lite-Chat
          llm-d.ai/role: decode
      spec:
        serviceAccountName: sa
        securityContext:
          fsGroup: 107
          supplementalGroups:
            - 107
        affinity:
          podAntiAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              - topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    llm-d.ai/role: decode
        resourceClaims:
          - name: xpu-decode-claim
            resourceClaimTemplateName: xpu-decode-claim
        volumes:
          - name: dshm
            emptyDir:
              medium: Memory
              sizeLimit: 16Gi
          - name: hf-cache
            emptyDir: {}
          - name: vllm-cache
            emptyDir: {}
        containers:
          - name: vllm
            image: REPLACE_MODEL_SERVER_IMAGE
            imagePullPolicy: Always
            securityContext:
              capabilities:
                add:
                  - IPC_LOCK
              runAsGroup: 0
              runAsUser: 0
            command:
              - /bin/bash
              - -c
            args:
              - |-
                find /dev/shm -type f -delete

                START_RANK=$(( ${LWS_WORKER_INDEX:-0} * DP_SIZE_LOCAL ))

                exec vllm serve \
                  deepseek-ai/DeepSeek-V2-Lite-Chat \
                  --host 0.0.0.0 \
                  --port 8200 \
                  --headless \
                  --trust-remote-code \
                  --dtype float16 \
                  --block-size 64 \
                  --enforce-eager \
                  --gpu-memory-utilization ${GPU_MEMORY_UTILIZATION} \
                  --max-model-len ${MAX_MODEL_LEN} \
                  --tensor-parallel-size ${TP_SIZE} \
                  --enable-expert-parallel \
                  --data-parallel-supervisor-port 8008 \
                  --data-parallel-size $((LWS_GROUP_SIZE * DP_SIZE_LOCAL)) \
                  --data-parallel-size-local ${DP_SIZE_LOCAL} \
                  --data-parallel-address ${LWS_LEADER_ADDRESS} \
                  --data-parallel-rpc-port 5555 \
                  --data-parallel-start-rank ${START_RANK} \
                  --all2all-backend allgather_reducescatter \
                  --kv-transfer-config '{"kv_connector":"NixlConnector",
                                          "kv_role":"kv_both",
                                          "kv_buffer_device":"xpu"}' \
                  --disable-access-log-for-endpoints=/health,/metrics,/v1/models
            env:
              - name: HF_TOKEN
                valueFrom:
                  secretKeyRef:
                    name: llm-d-hf-token
                    key: HF_TOKEN
              - name: VLLM_NIXL_SIDE_CHANNEL_HOST
                valueFrom:
                  fieldRef:
                    fieldPath: status.podIP
              - name: VLLM_NIXL_SIDE_CHANNEL_PORT
                value: "5600"
              - name: VLLM_USE_V1
                value: "1"
              - name: VLLM_WORKER_MULTIPROC_METHOD
                value: spawn
              - name: VLLM_ENABLE_V1_MULTIPROCESSING
                value: "1"
              - name: VLLM_MULTIPROC_EXECUTE_MODEL_TIMEOUT_S
                value: "1200"
              - name: TORCH_LLM_ALLREDUCE
                value: "1"
              - name: UCX_TLS
                value: tcp,ze_copy
              - name: UCX_MEMTYPE_CACHE
                value: "0"
              - name: USER
                value: llm-d
              - name: TP_SIZE
                value: "2"
              - name: DP_SIZE_LOCAL
                value: "1"
              - name: MAX_MODEL_LEN
                value: "512"
              - name: GPU_MEMORY_UTILIZATION
                value: "0.8"
              - name: VLLM_LOGGING_LEVEL
                value: INFO
              - name: HF_HUB_CACHE
                value: /var/cache/huggingface
              - name: VLLM_CACHE_ROOT
                value: /var/cache/vllm
            ports:
              - containerPort: 5600
                name: nixl
                protocol: TCP
            startupProbe:
              exec:
                command: ["bash", "-c", "pgrep -f 'vllm serve' > /dev/null"]
              initialDelaySeconds: 30
              periodSeconds: 30
              timeoutSeconds: 10
              failureThreshold: 120
            livenessProbe:
              exec:
                command: ["bash", "-c", "pgrep -f 'vllm serve' > /dev/null"]
              periodSeconds: 30
              timeoutSeconds: 10
              failureThreshold: 20
            readinessProbe:
              exec:
                command: ["bash", "-c", "pgrep -f 'vllm serve' > /dev/null"]
              periodSeconds: 10
              timeoutSeconds: 5
              failureThreshold: 6
            resources:
              limits:
                cpu: "16"
                memory: 128Gi
              requests:
                cpu: "16"
                memory: 128Gi
              claims:
                - name: xpu-decode-claim
            volumeMounts:
              - name: dshm
                mountPath: /dev/shm
              - name: hf-cache
                mountPath: /var/cache/huggingface
              - name: vllm-cache
                mountPath: /var/cache/vllm
