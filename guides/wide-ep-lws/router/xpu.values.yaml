router:
  epp:
    # Same config as wide-ep-lws.values.yaml minus the
    # disaggregatedset-rollout-screener: the XPU path deploys plain
    # LeaderWorkerSets, and the screener drops endpoints without
    # DisaggregatedSet revision labels.
    pluginsCustomConfig:
      wide-ep-lws-config.yaml: |
        apiVersion: llm-d.ai/v1alpha1
        kind: EndpointPickerConfig
        plugins:
        - type: always-disagg-pd-decider
        - type: disagg-profile-handler
          parameters:
            deciders:
              prefill: always-disagg-pd-decider
        - type: prefill-filter
        - type: decode-filter
        - type: prefix-cache-scorer
        - type: queue-scorer
        - type: active-request-scorer
        schedulingProfiles:
        - name: prefill
          plugins:
          - pluginRef: prefill-filter
          - pluginRef: prefix-cache-scorer
            weight: 3
          - pluginRef: queue-scorer
            weight: 2
          - pluginRef: active-request-scorer
            weight: 2
        - name: decode
          plugins:
          - pluginRef: decode-filter
          - pluginRef: active-request-scorer

  modelServers:
    targetPorts:
      - number: 8000
    matchLabels:
      llm-d.ai/guide: "wide-ep-lws"
      llm-d.ai/accelerator-variant: "xpu"
      llm-d.ai/accelerator-vendor: "intel"
      # Decode now runs as a cross-node LWS group (1 leader + N headless
      # workers). Only the leader carries the client-facing routing-proxy
      # sidecar / HTTP port 8000; headless workers share every other label
      # here but don't listen on 8000 at all. LWS auto-labels every group's
      # leader pod (including prefill's, since its group size is still 1)
      # with this role label, so restricting to it excludes decode workers
      # without needing a guide-specific label.
      leaderworkerset.sigs.k8s.io/role: "leader"
