apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base

patches:
  - target:
      kind: ResourceClaimTemplate
      name: xpu-decode-claim
    patch: |-
      apiVersion: resource.k8s.io/v1
      kind: ResourceClaimTemplate
      metadata:
        name: xpu-decode-claim
      spec:
        spec:
          devices:
            requests:
              - name: gpu
                exactly:
                  deviceClassName: gpu.intel.com
                  count: 1
              - name: nic
                exactly:
                  deviceClassName: dranet-rdma
                  count: 1
                  selectors:
                    - cel:
                        expression: device.attributes["dra.net"].rdma == true
            constraints:
              - matchAttribute: "resource.kubernetes.io/pcieRoot"
  - target:
      kind: ResourceClaimTemplate
      name: xpu-prefill-claim
    patch: |-
      apiVersion: resource.k8s.io/v1
      kind: ResourceClaimTemplate
      metadata:
        name: xpu-prefill-claim
      spec:
        spec:
          devices:
            requests:
              - name: gpu
                exactly:
                  deviceClassName: gpu.intel.com
                  count: 1
              - name: nic
                exactly:
                  deviceClassName: dranet-rdma
                  count: 1
                  selectors:
                    - cel:
                        expression: device.attributes["dra.net"].rdma == true
            constraints:
              - matchAttribute: "resource.kubernetes.io/pcieRoot"
  - target:
      kind: Deployment
      name: decode
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: decode
      spec:
        template:
          spec:
            containers:
              - name: modelserver
                env:
                  - name: UCX_TLS
                    value: ib,rc,ze_copy
  - target:
      kind: Deployment
      name: prefill
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: prefill
      spec:
        template:
          spec:
            containers:
              - name: modelserver
                env:
                  - name: UCX_TLS
                    value: ib,rc,ze_copy
